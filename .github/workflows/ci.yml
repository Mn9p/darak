name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      CRON_SECRET: ci-cron-secret-ci-cron-secret-ci-cron-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma validate + generate
        run: pnpm db:validate && pnpm db:generate
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Database + demo seed (smoke logs in as every demo role)
        run: pnpm db:push && pnpm db:seed:demo
      - name: Build
        run: pnpm build
      - name: Smoke test (all roles, all routes, tenant isolation)
        run: |
          (cd apps/web && npx next start -p 3111 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:3111/api/health && break; sleep 2; done
          BASE=http://localhost:3111 pnpm smoke

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t darak:${{ github.sha }} .
